server.port=8080

# Nota: no se usa server.servlet.context-path porque los controllers ya
# anteponen /api en su @RequestMapping. Con context-path las URLs quedaban /api/api/...
spring.application.name=autopartes-backend
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.datasource.url=jdbc:postgresql://db.ruvuaponemmepdwnqfce.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:o1s2w3q4@AAA}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000
app.currency.code=PEN
app.currency.symbol=S/.
app.upload.dir=uploads

# Swagger / OpenAPI
# UI en /api/swagger-ui/index.html  |  JSON en /api/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.disable-swagger-default-url=true