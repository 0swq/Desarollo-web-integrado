spring.application.name=autopartes-backend
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://db.ruvuaponemmepdwnqfce.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:o1s2w3q4@AAA}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# create = borra y recrea las tablas en cada arranque
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
