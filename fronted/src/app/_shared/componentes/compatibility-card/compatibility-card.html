<article class="compatibility-card">
  <div class="vehicle-photo">
    <img *ngIf="modelo?.imagenUrl && !imagenFallida; else sinFoto" [src]="modelo?.imagenUrl" [alt]="marca + ' ' + (modelo?.nombre || 'Vehículo')" loading="lazy" (error)="imagenFallida = true">
    <ng-template #sinFoto><div class="photo-placeholder"><i class="bi bi-car-front" aria-hidden="true"></i><span>Imagen no disponible</span></div></ng-template>
    <span *ngIf="modelo?.tipoVehiculo" class="vehicle-type">{{ modelo?.tipoVehiculo }}</span>
  </div>
  <div class="vehicle-info">
    <div class="brand-row"><span class="brand">{{ marca }}</span><span *ngIf="compatibilidad.notas?.startsWith('DEMO:')" class="demo-badge">DEMO</span></div>
    <h3>{{ modelo?.nombre || 'Modelo sin información' }}</h3>
    <dl class="fit-data">
      <div><dt><i class="bi bi-calendar3" aria-hidden="true"></i> Años</dt><dd>{{ anios }}</dd></div>
      <div><dt><i class="bi bi-gear" aria-hidden="true"></i> Motor</dt><dd>{{ compatibilidad.motor || 'Sin especificar' }}</dd></div>
    </dl>
    <details *ngIf="compatibilidad.notas" class="fit-notes"><summary>Notas de compatibilidad</summary><p>{{ compatibilidad.notas }}</p></details>
  </div>
</article>
