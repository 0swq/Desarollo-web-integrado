<div class="mobile-bar"><span>Administración</span><button type="button" (click)="abierto = !abierto" [attr.aria-expanded]="abierto" aria-controls="admin-sidebar" aria-label="Abrir o cerrar menú de administración"><i class="bi bi-list" aria-hidden="true"></i></button></div>
@if(abierto){<button class="sidebar-overlay" type="button" aria-label="Cerrar menú" (click)="cerrar()"></button>}
<aside id="admin-sidebar" class="sidebar" [class.open]="abierto" (keydown.escape)="cerrar()"><a routerLink="/administracion" class="brand" (click)="cerrar()"><img src="/images/autopartes-quiroz-blanco.svg" [alt]="parametros.contacto().nombre"><span>PANEL DE ADMINISTRACIÓN</span></a><div class="sidebar-scroll"><nav aria-label="Gestión"><h2>Gestión</h2>@for(item of gestion;track item.ruta){<a [routerLink]="['/administracion',item.ruta]" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="cerrar()"><i class="bi" [class]="'bi '+item.icono" aria-hidden="true"></i>{{item.nombre}}</a>}</nav>@if(esAdmin){<nav aria-label="Admin" class="admin-section"><h2>Admin</h2>@for(item of administracion;track item.ruta){<a [routerLink]="['/administracion',item.ruta]" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="cerrar()"><i [class]="'bi '+item.icono" aria-hidden="true"></i>{{item.nombre}}</a>}</nav>}</div><div class="sidebar-bottom"><button type="button" class="account" (click)="cerrar(); perfil.abrir()"><i class="bi bi-person-circle" aria-hidden="true"></i><span><strong>{{storage.obtenerNombre() || 'Mi cuenta'}}</strong><small>{{esAdmin ? 'Administrador' : 'Empleado'}}</small></span></button><a routerLink="/inicio" (click)="cerrar()"><i class="bi bi-shop" aria-hidden="true"></i> Volver a la tienda</a><button type="button" (click)="salir()"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Cerrar sesión</button></div></aside>
